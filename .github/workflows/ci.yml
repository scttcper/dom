name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest's transformed modules (fsModuleCache) and Node's compile cache, saved by the first
      # passing run with this lockfile and Node: entries are checked against file contents, so a
      # stale one only misses. Without them every run transforms and compiles everything again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.vitest-cache
            ${{ runner.temp }}/node-compile-cache
          key: test-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm typecheck
      - run: pnpm lint
      # Unused files, exports and dependencies (knip.json).
      - run: pnpm knip
      - run: pnpm fmt:check
      - run: pnpm test
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
      # Builds every package and assembles release/ (scripts/release.ts), then installs the three
      # tarballs into a fresh project and runs every documented setup against them.
      - run: pnpm build
      - run: pnpm test:pack --no-build
