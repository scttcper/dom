name: Release

# semantic-release, one version line per published package (tools/release): once CI passes on a
# push to main, each of @ctrl/dom, @ctrl/dom-jest-environment and @ctrl/sentry-tests is released when
# conventional commits since its last tag touch the files it is built from (feat → minor;
# fix, perf, deps → patch; breaking change → major). Run it by hand to release one package or to
# preview (dry run); a manual run checks the commit with CI first.
#
# npm: trusted publishing only (OIDC, no token). Each package's trusted publisher on npmjs.com
# names this repository and the workflow file `release.yml`; npm requires the package to exist
# before one can be configured, so a package's very first version is published by hand.
# Provenance: npm attaches it to trusted publishes from a public repository on its own;
# NPM_CONFIG_PROVENANCE makes a publish that cannot carry it fail instead of going out without it.

on:
  # After the CI workflow's run for a push to main, instead of running the same checks again.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        default: all
        options:
          - all
          - "@ctrl/dom"
          - "@ctrl/dom-jest-environment"
          - "@ctrl/sentry-tests"
      dry-run:
        description: Only report what would be released
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Manual runs only: pushes reach this workflow after CI has run on them.
  verify:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    # always(): a skipped verify (a CI run triggered this) must not skip the release. Only CI runs
    # that passed on a push release; a pull request's run never does, even from a branch named main.
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && needs.verify.result == 'success') ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # tags and GitHub releases
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release reads every tag and commit since the last release
          # The commit CI passed. If main has moved on since, semantic-release releases nothing and
          # the next CI run's release picks it up.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tools/release/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm install --dir tools/release --ignore-workspace --frozen-lockfile
      - name: semantic-release
        run: node tools/release/release.ts --package "$PACKAGE" $DRY_RUN
        env:
          PACKAGE: ${{ inputs.package || 'all' }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
